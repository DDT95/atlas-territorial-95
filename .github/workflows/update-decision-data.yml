name: Actualiser les données d’aide à la décision

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-decision-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchroniser et contrôler les référentiels
        run: npm run sync:decision
      - name: Valider la construction
        run: npm run build:github
      - name: Enregistrer les données actualisées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/decision/
          git diff --cached --quiet || git commit -m "data: actualiser le diagnostic territorial"
          git push
      - name: Signaler une source critique indisponible
        run: node -e "const h=require('./public/data/decision/health.json'); if(h.status!=='ok') process.exit(1)"
